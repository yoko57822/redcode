[package]
name = "redcode"
version = "0.1.0"
edition = "2024"
publish = false
description = "A GPUI desktop workbench for macOS: terminal, AI coding agent, Git graph and editor"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yoko57822/redcode"
readme = "README.md"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui-kit = { version = "=0.9.1", features = ["tree-sitter-languages"] }
alacritty_terminal = { version = "0.26.0", default-features = false }
agent-client-protocol = { version = "=5.2.0", features = ["process"] }
anyhow = "1"
chrono = "0.4"
futures = "0.3"
globset = "0.4"
ignore = "0.4"
libc = "0.2"
notify = "8.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2.7"
smallvec = "1"
smol = "2"
toml = "1"
ureq = { version = "3.5", features = ["json"] }

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-pre-sum-tree = { opt-level = 3 }
alacritty_terminal = { opt-level = 3 }
